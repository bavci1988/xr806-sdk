name: XR806 SDK one-shot integrated-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xr806-sdk-branch-cleanup-once.yml'
permissions:
  contents: write
jobs:
  archive-and-delete:
    if: github.repository == 'bavci1988/xr806-sdk'
    runs-on: ubuntu-24.04
    steps:
      - name: Lease-check branch, verify merge, archive immutable commit, delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          repo = "bavci1988/xr806-sdk"
          target = "claude/serene-franklin-jgpjuw"
          expected = "bd8d24f8b8a1c9db8cc3fe504db58215e67977f9"
          tag = "archive/post-merge-20261109/claude-serene-franklin-jgpjuw"
          token = os.environ["GH_TOKEN"]
          def call(method, route, body=None):
              url = "https://api.github.com/repos/" + repo + "/" + route
              request = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body is not None else None, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(request, timeout=35) as r:
                      v = r.read()
                      return json.loads(v) if v else None
              except urllib.error.HTTPError as e:
                  if method == "GET" and e.code == 404: return None
                  raise RuntimeError(str(e.code) + " " + e.read().decode()[:500])
          head = call("GET", "git/ref/heads/main")
          ref = call("GET", "git/ref/heads/" + urllib.parse.quote(target, safe="/"))
          if head is None: raise SystemExit("main not found")
          if ref is None:
              print("Feature branch already deleted; verifying preserved tag")
          else:
              if ref["object"]["sha"] != expected: raise SystemExit("Branch changed; refusing to delete")
              comparison = call("GET", "compare/" + expected + "..." + head["object"]["sha"])
              if comparison["behind_by"] != 0: raise SystemExit("Feature branch not fully incorporated; refusing deletion")
          old_tag = call("GET", "git/ref/tags/" + urllib.parse.quote(tag, safe="/"))
          if old_tag is None: call("POST", "git/refs", {"ref": "refs/tags/" + tag, "sha": expected})
          check_tag = call("GET", "git/ref/tags/" + urllib.parse.quote(tag, safe="/"))
          if check_tag is None or check_tag["object"]["sha"] != expected: raise SystemExit("Archive tag verification failed")
          if ref is not None:
              call("DELETE", "git/refs/heads/" + urllib.parse.quote(target, safe="/"))
              if call("GET", "git/ref/heads/" + urllib.parse.quote(target, safe="/")) is not None: raise SystemExit("Delete failed")
          branches = call("GET", "branches?per_page=100")
          assert [b["name"] for b in branches] == ["main"], [b["name"] for b in branches]
          print("SUCCESS: only main branch remains, archive tag verified at " + expected)
          PY
