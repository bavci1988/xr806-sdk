name: XR806 ESPHome firmware smoke test

on:
  push:
    branches:
      - ci/xr806-espbuild
      - main
    paths:
      - .github/workflows/xr806-esphome-smoke.yml
      - ci/rebuild-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: UART0 low-power and GPIO IRQ firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned private XR806 SDK
        uses: actions/checkout@v4
        with:
          ref: daeb7f7a6c157a7fe83d59949bbbf4a4cc58616a
          path: sdk
          persist-credentials: false

      - name: Check out ESPHome XR806 development branch
        uses: actions/checkout@v4
        with:
          repository: bavci1988/esphome-xr806
          ref: feature/xr806-native
          path: esphome-xr806
          persist-credentials: false

      - name: Install ARM toolchain
        run: |
          set -euo pipefail
          # Use verified GCC 13.3.1 with complete C++20 standard library.
          TOOLCHAIN_URL="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.3.1-1.1/xpack-arm-none-eabi-gcc-13.3.1-1.1-linux-x64.tar.gz"
          # GitHub release CDN occasionally responds 504; retry with bounded backoff.
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 240 --output /tmp/arm-gcc.tar.gz "$TOOLCHAIN_URL"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "::error::Toolchain download failed after five attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          test "$(stat -c %s /tmp/arm-gcc.tar.gz)" -gt 50000000
          tar -tzf /tmp/arm-gcc.tar.gz >/dev/null
          mkdir -p "$RUNNER_TEMP/arm-gcc"
          tar -xzf /tmp/arm-gcc.tar.gz -C "$RUNNER_TEMP/arm-gcc"
          CC_BIN="$(find "$RUNNER_TEMP/arm-gcc" -type f -name arm-none-eabi-gcc -print -quit)"
          if [[ -z "$CC_BIN" ]]; then
            echo "::error::arm-none-eabi-gcc not found in extracted archive"
            find "$RUNNER_TEMP/arm-gcc" -maxdepth 3 -type d
            exit 1
          fi
          CC_DIR="$(dirname "$CC_BIN")"
          test -x "$CC_BIN"
          "$CC_DIR/arm-none-eabi-gcc" --version
          echo "CC_DIR=$CC_DIR" >> "$GITHUB_ENV"
          echo "$CC_DIR" >> "$GITHUB_PATH"
          test -x "$CC_DIR/arm-none-eabi-g++"

      - name: Install ESPHome Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./esphome-xr806

      - name: Populate verified SDK cache from private checkout
        run: |
          set -euo pipefail
          SDK_DIR="$GITHUB_WORKSPACE/sdk"
          CACHE_PARENT="$HOME/.cache/esphome-xr806/dependencies/xr806_sdk"
          SHA="daeb7f7a6c157a7fe83d59949bbbf4a4cc58616a"
          test "$(git -C "$SDK_DIR" rev-parse HEAD)" = "$SHA"
          test -z "$(git -C "$SDK_DIR" status --porcelain --untracked-files=all)"
          mkdir -p "$CACHE_PARENT"
          ln -s "$SDK_DIR" "$CACHE_PARENT/$SHA"

      - name: Generate standalone test configurations
        run: |
          mkdir -p ci-tests
          cat > ci-tests/xr806_trv16_uart0_lowpower_test.yaml <<'YAML'
          esphome:
            name: xr806-trv16-uart0-lp
          xr806:
            board: wxu
            lowpower: true
          uart:
            id: mcu_uart
            baud_rate: 115200
            tx_pin: PB0
            rx_pin: PB1
            rx_buffer_size: 256
            data_bits: 8
            stop_bits: 1
            parity: NONE
          YAML
          cat > ci-tests/xr806_irq_linkprobe.yaml <<'YAML'
          esphome:
            name: xr806-irq-linkprobe
          xr806:
            board: wxu
          binary_sensor:
            - platform: gpio
              name: "WXU Test input"
              use_interrupt: true
              pin:
                number: PA20
                mode: INPUT_PULLUP
          YAML

      - name: Compile UART0 low-power firmware
        run: |
          set -o pipefail
          python3 -m esphome compile ci-tests/xr806_trv16_uart0_lowpower_test.yaml

      - name: Compile GPIO interrupt firmware
        run: |
          set -o pipefail
          python3 -m esphome compile ci-tests/xr806_irq_linkprobe.yaml

      - name: Verify AWIH images
        run: |
          set -euo pipefail
          for name in xr806-trv16-uart0-lp xr806-irq-linkprobe; do
            base="ci-tests/.esphome/build/$name"
            fw="$base/.pioenvs/$name/firmware.bin"
            img="$base/xr806/firmware/firmware.img"
            test -s "$fw"
            test -s "$img"
            test "$(head -c 4 "$fw")" = AWIH
            cmp "$fw" "$img"
            sha256sum "$fw"
          done
