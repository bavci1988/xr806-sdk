name: Stage 7b ESPHome AWIH cross-build
on:
  push:
    branches: [ci/stage7b-standby-compile]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage7b-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout pinned XR806 SDK (private; isolated)
        uses: actions/checkout@v4
        with:
          ref: 963f6f74030bc2fdbf430e66092ca96f6a0c7a6c
          path: vendor-sdk
          persist-credentials: false
      - name: Checkout ESPHome Stage 7b
        uses: actions/checkout@v4
        with:
          repository: bavci1988/esphome-xr806
          ref: stage7b/standby-wakeup
          path: esphome-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM toolchain and Python build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libnewlib-arm-none-eabi
          python -m pip install -e ./esphome-src
      - name: Build OFFLINE WXU PA20/timer standby AWIH
        env:
          CC_DIR: /usr/bin
          XR806_SDK_SOURCE_DIR: ${{ github.workspace }}/vendor-sdk
          XR806_SDK_EXPECTED_COMMIT: 963f6f74030bc2fdbf430e66092ca96f6a0c7a6c
        run: |
          cat > /tmp/stage7b-ci.yaml <<'YAML'
          esphome:
            name: xr806-stage7b-ci
          xr806:
            board: wxu
            lowpower: true
            standby_trial:
              confirm_offline: true
              entry_after_ms: 10000
              wake_after_ms: 3000
              wake_pin: PA20
              wake_edge: falling
          logger:
            level: DEBUG
          YAML
          cd esphome-src
          python -m esphome config /tmp/stage7b-ci.yaml
          python -m esphome compile /tmp/stage7b-ci.yaml
          find /tmp -type f \( -name '*.img' -o -name 'firmware.bin' \) -print
