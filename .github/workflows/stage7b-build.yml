name: Stage 7b ESPHome AWIH cross-build
on:
  push:
    branches: [ci/stage7b-standby-compile]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage7b-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout pinned XR806 SDK (private; isolated)
        uses: actions/checkout@v4
        with:
          ref: 963f6f74030bc2fdbf430e66092ca96f6a0c7a6c
          path: vendor-sdk
          persist-credentials: false
      - name: Checkout ESPHome Stage 7b
        uses: actions/checkout@v4
        with:
          repository: bavci1988/esphome-xr806
          ref: stage7b/standby-wakeup
          path: esphome-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM toolchain and Python build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          python -m pip install -e ./esphome-src
      - name: Build OFFLINE WXU PA20/timer standby AWIH (no logger backend)
        env:
          CC_DIR: /usr/bin
          XR806_SDK_SOURCE_DIR: ${{ github.workspace }}/vendor-sdk
          XR806_SDK_EXPECTED_COMMIT: 963f6f74030bc2fdbf430e66092ca96f6a0c7a6c
        run: |
          cat > /tmp/stage7b-ci.yaml <<'YAML'
          esphome:
            name: xr806-stage7b-ci
          xr806:
            board: wxu
            lowpower: true
            standby_trial:
              confirm_offline: true
              entry_after_ms: 10000
              wake_after_ms: 3000
              wake_pin: PA20
              wake_edge: falling
              resume_marker_pb05: true
          YAML
          cd esphome-src
          python -m esphome config /tmp/stage7b-ci.yaml
          python -m esphome -v compile /tmp/stage7b-ci.yaml
          python - <<'PY'
          from pathlib import Path
          base = Path("/tmp/.esphome/build/xr806-stage7b-ci")
          image = base / "xr806/firmware/firmware.img"
          output = base / ".pioenvs/xr806-stage7b-ci/firmware.bin"
          for path in (image, output):
              assert path.is_file() and path.stat().st_size > 0, path
              assert path.read_bytes()[:4] == b"AWIH", path
              print(f"PASS XR806 AWIH: {path} ({path.stat().st_size} bytes)")
          PY
      - name: Save bench-only AWIH image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xr806-stage7b-bench-awih
          path: /tmp/.esphome/build/xr806-stage7b-ci/.pioenvs/xr806-stage7b-ci/firmware.bin
          if-no-files-found: error
          retention-days: 7
