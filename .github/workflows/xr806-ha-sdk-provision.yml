name: XR806 HA SDK provisioning smoke test

on:
  workflow_dispatch:
  push:
    branches: [ci/abi-compat-audit]
    paths: [.github/workflows/xr806-ha-sdk-provision.yml]

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 963f6f74030bc2fdbf430e66092ca96f6a0c7a6c
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bavci1988/esphome-xr806
          ref: 83e85869a132ad0372331976271be07523c28bba
          path: esphome-xr806
          persist-credentials: false
      - name: Validate external SDK provisioning without SSH
        env:
          XR806_SDK_SOURCE_DIR: ${{ github.workspace }}/sdk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          p = Path("esphome-xr806/esphome/components/xr806/build_support/dependencies.py")
          spec = importlib.util.spec_from_file_location("xr806_dependencies", p)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          sdk = module.ensure_dependency("xr806_sdk")
          assert sdk == Path(os.environ["XR806_SDK_SOURCE_DIR"]).resolve()
          assert (sdk / "gcc.mk").is_file()
          print("PASS: pre-provisioned private SDK accepted without SSH clone")
          PY
      - name: Verify invalid SDK checkout is rejected
        env:
          XR806_SDK_SOURCE_DIR: ${{ github.workspace }}/esphome-xr806
        run: |
          python3 - <<'PY'
          import importlib.util
          p = "esphome-xr806/esphome/components/xr806/build_support/dependencies.py"
          spec = importlib.util.spec_from_file_location("xr806_dependencies", p)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              module.ensure_dependency("xr806_sdk")
          except RuntimeError:
              print("PASS: incorrect SDK checkout rejected")
          else:
              raise AssertionError("Incorrect SDK checkout was accepted")
          PY
