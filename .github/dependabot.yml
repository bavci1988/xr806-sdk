version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    # Intentionally disable automatic version PRs/branches for this focused
    # hardware SDK. Reactivate manually after the branch-cleanup cycle.
    # GitHub Dependabot security alerts/updates are separate settings.
    open-pull-requests-limit: 0
